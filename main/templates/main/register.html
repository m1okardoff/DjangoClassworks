{% extends 'main/layout.html' %}

{% block title %}
Реєстрація
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm mt-4">
      <div class="card-body p-4">
        <h2 class="card-title text-center mb-4">Реєстрація</h2>

        <!-- Блок повідомлення про успіх / помилку -->
        <div id="alertMessage" class="alert d-none" role="alert"></div>

        <form id="registerForm" enctype="multipart/form-data">
          {% csrf_token %}

          <div class="mb-3">
            <label for="username" class="form-label">Ім'я користувача</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="Введіть логін" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Електронна пошта</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Пароль</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Введіть пароль"
                   required>
          </div>

          <div class="mb-3">
            <label for="avatar" class="form-label">Аватарка</label>
            <input type="file" class="form-control" id="avatar" name="avatar" accept="image/*">
            <div class="form-text">Оберіть файл зображення для вашого профілю.</div>
            <div id="avatarPreviewContainer" class="mt-3 text-center d-none">
              <img id="avatarPreview" src="#" alt="Попередній перегляд аватарки" class="rounded-circle shadow-sm" style="width: 100px; height: 100px; object-fit: cover; border: 2px solid #0d6efd;">
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100">Зареєструватися</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
    const avatarInput = document.getElementById('avatar');
    const avatarPreviewContainer = document.getElementById('avatarPreviewContainer');
    const avatarPreview = document.getElementById('avatarPreview');

    avatarInput.addEventListener('change', function () {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                avatarPreview.src = e.target.result;
                avatarPreviewContainer.classList.remove('d-none');
            };
            reader.readAsDataURL(file);
        } else {
            avatarPreview.src = '#';
            avatarPreviewContainer.classList.add('d-none');
        }
    });

    document.getElementById('registerForm').addEventListener('submit', async function (event) {
        event.preventDefault(); // Запобігаємо звичайному перезавантаженню сторінки

        // Збираємо значення полів форми включно з файлом аватарки
        const formData = new FormData(this);

        // Отримуємо значення CSRF-токена з форми
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
        const alertBox = document.getElementById('alertMessage');

        try {
            // Відправляємо дані у форматі multipart/form-data
            const response = await fetch("{% url 'register' %}", {
                method: "POST",
                headers: {
                    "X-CSRFToken": csrfToken
                },
                body: formData
            });

            const result = await response.json();

            if (response.ok && result.status === 'success') {
                alertBox.className = "alert alert-success";
                alertBox.textContent = result.message || "Успішно!";
                alertBox.classList.remove('d-none');
                this.reset(); // Очищаємо поля після успіху
                avatarPreview.src = '#';
                avatarPreviewContainer.classList.add('d-none');
            } else {
                alertBox.className = "alert alert-danger";
                alertBox.textContent = result.message || "Помилка при реєстрації.";
                alertBox.classList.remove('d-none');
            }
        } catch (error) {
            console.error("Помилка запиту:", error);
            alertBox.className = "alert alert-danger";
            alertBox.textContent = "Не вдалося з'єднатися з сервером.";
            alertBox.classList.remove('d-none');
        }
    });
</script>

{% endblock %}
