{% extends 'main/layout.html' %}

{% block title %}
Головна сторінка
{% endblock %}

{% block content %}
    <!-- Заголовок та форма пошуку -->
    <div class="p-5 mb-4 bg-white rounded-3 shadow-sm">
        <h1 class="display-5 fw-bold">Вітаємо на нашому сайті!</h1>
        <p class="fs-5 text-muted">
            Введіть назву картки для швидкого пошуку або оберіть розділ нижче.
        </p>

        <!-- Форма пошуку за назвою -->
        <form action="{% url 'search' %}" method="GET" class="mt-4">
            <div class="row g-2">
                <div class="col-md-9 col-sm-8">
                    <input type="text" name="name" class="form-control form-control-lg" placeholder="Введіть назву (наприклад, Розділ 1, Розділ 2)..." required>
                </div>
                <div class="col-md-3 col-sm-4">
                    <button type="submit" class="btn btn-primary btn-lg w-100">Шукати за назвою</button>
                </div>
            </div>
        </form>
    </div>
{% endblock %}
